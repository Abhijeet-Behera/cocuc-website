<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Calendar body -->
  <rect x="40" y="50" width="120" height="110" rx="12" fill="#fff" stroke="#800000" stroke-width="3"/>
  <!-- Calendar header -->
  <rect x="40" y="50" width="120" height="35" rx="12" fill="#800000"/>
  <rect x="40" y="73" width="120" height="12" fill="#800000"/>
  <!-- Rings -->
  <rect x="70" y="40" width="6" height="22" rx="3" fill="#5c0000"/>
  <rect x="124" y="40" width="6" height="22" rx="3" fill="#5c0000"/>
  <!-- Calendar text -->
  <text x="100" y="75" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">EVENT</text>
  <!-- Grid dots for dates -->
  <circle cx="62" cy="105" r="4" fill="#e8c4c4"/>
  <circle cx="82" cy="105" r="4" fill="#e8c4c4"/>
  <circle cx="102" cy="105" r="4" fill="#a31f1f"/>
  <circle cx="122" cy="105" r="4" fill="#e8c4c4"/>
  <circle cx="142" cy="105" r="4" fill="#e8c4c4"/>
  <circle cx="62" cy="125" r="4" fill="#e8c4c4"/>
  <circle cx="82" cy="125" r="4" fill="#e8c4c4"/>
  <circle cx="102" cy="125" r="4" fill="#e8c4c4"/>
  <circle cx="122" cy="125" r="4" fill="#e8c4c4"/>
  <circle cx="142" cy="125" r="4" fill="#e8c4c4"/>
  <circle cx="62" cy="145" r="4" fill="#e8c4c4"/>
  <circle cx="82" cy="145" r="4" fill="#d4a0a0"/>
  <circle cx="102" cy="145" r="4" fill="#e8c4c4"/>
  <!-- Star on highlighted date -->
  <circle cx="102" cy="105" r="7" fill="none" stroke="#800000" stroke-width="2"/>
</svg>
